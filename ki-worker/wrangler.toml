name = "ordela-ki"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
PACKAGE_NAME = "app.effyra.twa"
# capacitor://localhost = iOS-App (Capacitor-WebView)
ALLOWED_ORIGINS = "https://darekkk80-neuss.github.io,capacitor://localhost"
# Produkt-Id in der Play Console -> Anzahl Briefe
SKU_CREDITS = '{"ordela_ki_25":25,"ordela_ki_50":50}'
MODEL = "gpt-5-mini"
# iOS-App: Bundle-Id fuer die Apple-Kaufpruefung. APPLE_SANDBOX="1" nimmt auch Sandbox-/TestFlight-Kaeufe an
# (Apple empfiehlt: erst Produktion, dann Sandbox fragen). Schluessel: siehe src/index.js (Geheimnisse).
APPLE_BUNDLE_ID = "app.ordela.ios"
APPLE_SANDBOX = "1"

[[d1_databases]]
binding = "DB"
database_name = "ordela-ki"
database_id = "933594d7-c910-4df5-a276-419c86181310"   # Region WEUR (Westeuropa)
